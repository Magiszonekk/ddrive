<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Ddrive — Free cloud storage</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="ddrive is a free cloud storage and Google Drive alternative. Upload, store and stream files. Open source, self-hostable, no file size limits."
    />
    <link rel="canonical" href="https://ddrive.cikowice.pl/app/" />
    <meta property="og:title" content="Ddrive — Free cloud storage" />
    <meta
      property="og:description"
      content="ddrive is a free cloud storage and Google Drive alternative. Upload, store and stream files."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ddrive.cikowice.pl/app/" />
    <meta property="og:image" content="https://ddrive.cikowice.pl/og-image.png" />
    <meta property="og:site_name" content="ddrive" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ddrive — Free cloud storage" />
    <meta
      name="twitter:description"
      content="ddrive is a free cloud storage and Google Drive alternative. Upload, store and stream files."
    />
    <meta name="twitter:image" content="https://ddrive.cikowice.pl/og-image.png" />
    <script>
      // Applied before first paint to avoid a flash of the wrong theme.
      // Mirrors the logic in src/stores/colorMode.ts.
      (function () {
        try {
          var stored = localStorage.getItem("ddv4:color-mode");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {
          /* localStorage unavailable — fall back to prefers-color-scheme */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
